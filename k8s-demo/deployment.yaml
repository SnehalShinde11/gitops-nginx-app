apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-nginx-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-nginx-demo

  template:
    metadata:
      labels:
        app: gitops-nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - containerPort: 80
